name: Tests

# Les deux suites unitaires, à chaque commit. Ni KataGo, ni modèles, ni GPU : les
# tests du pont tournent sur un moteur factice et ceux de l'app ne sortent pas de
# MoyoCore. Quelques minutes, et rien qui ressemble à une release.
#
# Tout ce qui demande une vraie machine — compiler KataGo, assembler le bundle, le
# faire jouer, le signer, l'envoyer — vit dans app/Scripts/release.sh et se lance
# depuis un Mac. Un runner GitHub a un GPU paravirtualisé : il sait construire, il
# ne sait pas prouver que ça joue.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: 🐍 Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            bridge/requirements-dev.txt

      - name: Install KaTrain and pytest
        # katrain tire kivy, qui sur Linux veut des en-têtes SDL2 pour se compiler.
        # Le pont ne l'importe jamais — il a son propre shim — mais pip, lui, résout
        # la dépendance déclarée. requirements-dev.txt et non requirements.txt :
        # celui-ci ne porte que ce qui part dans le bundle, et pytest n'y est pas.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev
          pip install --quiet -r bridge/requirements-dev.txt

      - run: python -m pytest bridge/tests -q

  app:
    name: 🍎 App
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Select the latest final Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: swift test --package-path app
